app = "chrishayuk-site"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Machine readership counts live on the volume below. Unset elsewhere, so
  # local, preview and Sites builds classify requests and store nothing.
  READERSHIP_DB = "/data/readership.db"
  # Declarations, on the same volume and in a separate file. Separate files
  # because declarations and traffic counters have different retention rules,
  # and separate files are the only separation that survives a hurried DELETE.
  MACHINE_DB = "/data/machine.db"
  # Agent feedback: its own file again, because it is the only store here
  # that holds prose and it must not share a retention rule with counters.
  FEEDBACK_DB = "/data/feedback.db"

  # MACHINE-RECIPROCITY-1, the experimental variable: what declaring buys.
  # none | parity | superior. See lib/machine/reward.ts and
  # docs/machine-reciprocity-1.md.
  #
  # It lives here rather than in `fly secrets` on purpose. Deployment is
  # push-triggered, so the arm the site was serving becomes part of the git
  # record instead of invisible machine state — and for a preregistered
  # experiment, being able to prove afterwards which arm was deployed when is
  # worth more than saving a commit. It is machine configuration, not a build
  # argument, so the image is identical across every arm.
  #
  # ARMS 5 and 6 of 6: superior / sent-here, then superior / incidental.
  # Arms 1-2 ran under "none", arms 3-4 under "parity". Transcripts are in
  # docs/reciprocity. These are the two cells that discriminate: only here does
  # a declaration change what the retrieval returns, so only here does
  # declaring stop being a side effect with no return.
  MACHINE_REWARD = "superior"

# One machine, one volume: `fly volumes create readership --size 1 --region lhr`.
# It holds hourly counters only — no addresses, sessions or request logs.
[mounts]
  source = "readership"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
