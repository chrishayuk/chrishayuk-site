name: Deploy chrishayuk.com

on:
  push:
    branches: [main]
    # The archive job commits back the first-capture dates it learns, and the
    # published crawler addresses it refreshes. Those commits touch nothing
    # else, and must not start another deploy.
    paths-ignore: [content/archive.json, content/agent-ranges.json]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preserve published manuscripts and evidence history
        run: npm run audit:provenance
        env:
          PROVENANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build:fly
        env:
          SITE_INDEXABLE: "true"
      - name: Check production pages and canonical redirects
        run: |
          SITE_INDEXABLE=true READERSHIP_DB=/tmp/chrishayuk-readership.db npm run start:fly -- --port 3000 > /tmp/chrishayuk-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          npm run test:deployment
          node scripts/check-publication-pages.mjs
          npm run audit:notebooks
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false --build-arg GIT_COMMIT=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://chrishayuk-site.fly.dev/api/health -o /tmp/health.json
          python3 - <<'PY'
          import json, os
          health = json.load(open('/tmp/health.json'))
          assert health['status'] == 'ok'
          assert health['commit'] == os.environ['EXPECTED_COMMIT'], health
          print('Deployed revision verified')
          PY

  # PUBLISH -> COMMIT -> ARCHIVE. The deploy is what makes a page real at its
  # canonical URL; this asks an independent party to keep a copy of it, and
  # records when that party FIRST saw it. Without IA credentials the script
  # still runs, reads the public Wayback index and records what is already
  # there, so a fork or a PR checkout is never blocked on a secret.
  archive:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check archive configuration
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "::warning::New captures need IA_ACCESS_KEY and IA_SECRET_KEY repository secrets. This run only resolves existing captures."
          fi
      - name: Archive the canonical objects
        timeout-minutes: 15
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: node --experimental-strip-types scripts/archive-wayback.ts --limit 6
      # A first capture is evidence, so it is committed rather than cached:
      # the date belongs in the repository's history, next to the record it
      # corroborates. It reaches the site on the next deploy.
      - name: Record the first captures
        run: |
          git diff --quiet content/archive.json && { echo "No new captures."; exit 0; }
          git config user.name "chrishayuk-site"
          git config user.email "noreply@chrishayuk.com"
          git add content/archive.json
          git commit -m "Record independent archive captures"
          git pull --rebase origin main
          git push origin HEAD:main
      # Verification is only as good as the address lists it checks against.
      # Providers rotate ranges, and a stale snapshot would start calling
      # real crawlers unverifiable, so the snapshot is refreshed after every
      # deploy and committed with its retrieval date. A source that fails to
      # respond leaves what is already on file untouched.
      - name: Refresh the published crawler addresses
        timeout-minutes: 5
        run: node --experimental-strip-types scripts/refresh-agent-ranges.ts
      - name: Record the published crawler addresses
        run: |
          git diff --quiet content/agent-ranges.json && { echo "Published ranges unchanged."; exit 0; }
          git config user.name "chrishayuk-site"
          git config user.email "noreply@chrishayuk.com"
          git add content/agent-ranges.json
          git commit -m "Refresh published crawler address ranges"
          git pull --rebase origin main
          git push origin HEAD:main
